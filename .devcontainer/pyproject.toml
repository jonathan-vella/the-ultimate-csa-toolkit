[project]
name = "csa-toolkit"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "diagrams==0.25.1",
    "matplotlib==3.11.2",
    "pillow==12.3.0",
    "checkov==3.3.22",
]

[tool.uv]
package = false
constraint-dependencies = ["aiohttp==3.14.3"]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
